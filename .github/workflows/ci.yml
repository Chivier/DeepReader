name: Tests and security
on:
  push:
  pull_request:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libcairo2
      - run: python -m pip install -r requirements_dev.txt
      - run: python -m pip check
      - run: python -m compileall -q reader website
      - run: python -m pytest -q
      - run: python -m reader.main --help
      - run: pip-audit -r requirements.txt --no-deps --disable-pip
      - run: pip-audit -r requirements_video.txt --no-deps --disable-pip
